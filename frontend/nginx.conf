server {
    listen 80;
    server_name edusmart.ign3el.com;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's own _MAX_UPLOAD_SIZE_BYTES (20MB). It used to be
    # 50M, so a 21-50MB file was accepted, streamed all the way to the app, and
    # only then rejected - wasting the whole transfer on a mobile connection.
    client_max_body_size 20M;

    # PWA & Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP. 'unsafe-inline'/'unsafe-eval' are required by the Vite bundle and the
    # WebGL/3D scene code; everything else is locked to same-origin. blob: and
    # data: are needed for generated audio/images and the offline ZIP export.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.fbcdn.net; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://graph.facebook.com https://www.facebook.com; frame-src 'self' https://accounts.google.com https://www.facebook.com https://staticxx.facebook.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Service Worker must be served with correct MIME type
    location ~* (service-worker\.js|sw\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
        types {
            application/javascript js;
        }
    }

    # Manifest file
    location ~* \.webmanifest$|manifest\.json$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Type "application/manifest+json";
    }

    # Vite emits content-hashed filenames under /assets/ (index-BE8k47xj.js), so
    # the name changes whenever the bytes do. These are the only files here that
    # are genuinely immutable. ^~ makes this prefix match win over the regex
    # locations below, which would otherwise catch the same .js/.css.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Self-hosted fonts: stable filenames, but they only change when a typeface
    # is deliberately swapped. A week, revalidatable - not immutable.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Icons, screenshots, favicons (but NOT API-served images).
    #
    # 'immutable' was WRONG here and cost us a shipped change: these filenames
    # are stable (/icon-192.png), and an icon redesign ships under the same
    # name. immutable tells browsers AND the Cloudflare edge never to
    # revalidate, so on 2026-07-25 a new app icon was correct in the container
    # (22018 bytes) while the edge kept serving the old one (3469 bytes) with
    # cf-cache-status: HIT - undeliverable for the full 7 days.
    # A day, revalidatable, so the next redesign actually reaches anyone.
    location ~* ^/(?!api/).*\.(png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Any remaining stable-named js/css/font outside /assets/ and /fonts/.
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # nginx add_header does NOT inherit into a location that defines its own,
        # so the server-level security headers above were being silently dropped
        # for the one response that matters most - the HTML document. Verified
        # against production before this line existed: no CSP, and no
        # X-Frame-Options either, despite both being declared at server level.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.fbcdn.net; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://graph.facebook.com https://www.facebook.com; frame-src 'self' https://accounts.google.com https://www.facebook.com https://staticxx.facebook.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Without these the backend saw this container's IP for every visitor,
        # so the login rate limiter was a single global bucket - five failed
        # logins from anyone locked out the entire site. Passed through verbatim
        # (not $proxy_add_x_forwarded_for) so the value stays exactly what the
        # host nginx set from the Cloudflare-restored $remote_addr, with no
        # extra hop appended for the backend to have to guess about.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        
        # Increase timeouts for long-running AI generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
